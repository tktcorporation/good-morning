# 全ワークフロー共通の pnpm + Node.js セットアップと依存インストール。
# ツールチェーン設定（Node バージョン・キャッシュ・install フラグ）の SSOT。
# ジョブごとにコピーすると更新漏れでジョブ間のツールチェーンが食い違うため、
# 必ずこの composite action を経由すること。
name: Setup pnpm
description: pnpm / Node.js のセットアップと pnpm install --frozen-lockfile

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - uses: actions/setup-node@v7
      with:
        node-version: '22.22.2'
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
