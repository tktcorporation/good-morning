name: Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      # write 権限のトークンを渡す第三者アクションのため、mutable tag ではなく
      # commit SHA で固定する（タグ差し替え型のサプライチェーン攻撃対策）
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
