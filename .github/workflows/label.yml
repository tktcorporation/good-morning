name: Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      # write 権限のトークンを渡す第三者アクションのため、mutable tag ではなく
      # commit SHA で固定する（タグ差し替え型のサプライチェーン攻撃対策）
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
