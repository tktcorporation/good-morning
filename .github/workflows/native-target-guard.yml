# targets/ 配下に新しいネイティブターゲット（Widget / App Extension 等）を
# 追加する PR を検出するガード。
#
# 非対話の EAS ビルドは新規ターゲットの Provisioning Profile を生成できないため、
# EAS への credentials 登録（docs/release.md 参照）を済ませずにマージすると、
# 次のリリースの EAS ビルドが必ず失敗する。ドキュメントだけでは読み落とせないので、
# CI で機械的に止める。
#
# 登録を済ませたら PR に `eas-credentials-registered` ラベルを付けると通過する。
#
# path フィルターを付けずに全 PR で実行する: このジョブを required status check に
# するには、targets/ を触らない PR でも必ず success を報告する必要がある
# （path フィルターで skip されると required check が満たされず merge が永久に
# ブロックされる）。判定自体はジョブ内の git diff で行う。
name: Native Target Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Check new native targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fail if a new target lacks registered credentials
        env:
          BASE_REF: ${{ github.base_ref }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'eas-credentials-registered') }}
        run: |
          set -euo pipefail
          CHANGED_TARGETS=$(git diff --diff-filter=AM --name-only \
            "origin/${BASE_REF}...HEAD" -- 'targets/*/expo-target.config.*')
          if [ -z "$CHANGED_TARGETS" ]; then
            echo "ネイティブターゲット設定の追加・変更なし"
            exit 0
          fi
          echo "追加・変更されたターゲット設定を検出:"
          echo "$CHANGED_TARGETS"
          if [ "$HAS_LABEL" = "true" ]; then
            echo "eas-credentials-registered ラベルを確認。登録済みとして通過。"
            exit 0
          fi
          echo "::error::ネイティブターゲット設定が追加・変更されていますが、EAS credentials の登録が確認できません。docs/release.md の手順で 'eas credentials --platform ios' を実行し、完了後にこの PR へ 'eas-credentials-registered' ラベルを付けてください。"
          exit 1
