name: "Issue Links"

on:
  pull_request:
    types: [opened]

jobs:
  issue-link:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # write 権限のトークンを渡す第三者アクションのため、mutable tag ではなく
      # commit SHA で固定する（タグ差し替え型のサプライチェーン攻撃対策）
      - uses: tkt-actions/add-issue-links@841937371056b3af09cdbdf8c45d8bd48c58fcec # v1.9.1
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          branch-prefix: "/"
          resolve: "false"
          link-style: "comment"
