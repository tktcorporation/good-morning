name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一 PR への連続 push では旧 run をキャンセルして無駄な実行を止める。
# main への push は履歴として全 run を残したいのでキャンセルしない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm biome format .

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm test

  doctor:
    name: Expo Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: npx expo install --check
      # expo-doctor は devDependencies に固定したものを使う。
      # `npx -y expo-doctor` だと毎 run で registry の latest を未レビューのまま
      # 実行することになり、lockfile によるサプライチェーン保護が効かない。
      - run: pnpm exec expo-doctor

  # Metro バンドルが通ることを CI で保証する。
  # 起動直後にクラッシュする原因の多くは、未解決 import や循環参照など
  # バンドル時に検出できる問題。`expo export` を回すと本番と同じ Metro パイプラインを
  # 経由するため、ローカル `expo run` だけでは見落としがちな構成エラーを捕まえられる。
  bundle:
    name: Bundle Export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm bundle:check
