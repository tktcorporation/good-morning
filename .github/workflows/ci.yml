name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一 PR への連続 push では旧 run をキャンセルして無駄な実行を止める。
# main への push は履歴として全 run を残したいのでキャンセルしない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      # tsc --incremental の .tsbuildinfo をキャッシュし、変更のないファイルの
      # 再チェックをスキップして高速化する。key に github.sha を含めて実行ごとに
      # 新規保存させ (同一キーは actions/cache が上書き保存しないため)、
      # restore-keys で直近の保存分を fallback として拾う。
      - name: Cache tsc incremental build info
        uses: actions/cache@v6
        with:
          path: .tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm biome format .

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 変更検出に origin/${{ base_ref }} との diff が要るため常に全履歴を取得する。
      # (native-target-guard.yml と同じ理由。push イベント用に条件分岐で depth を
      # 変える最適化は GitHub Actions 式の `&&`/`||` が 0 を falsy 扱いするため
      # 意図通りに働かず、事故ると required check が全滅する。単純さを優先する)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PR で test に影響しうるファイルが変更されていなければスキップする。
      # `paths:` トリガーでジョブごと止めると required status check が
      # success を報告できずマージが永久ブロックされるため使わない
      # (native-target-guard.yml 参照)。ジョブ自体は必ず起動し、
      # 内部の git diff で判定してから後続 step を skip する。
      - name: Detect test-relevant changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- \
            app src package.json pnpm-lock.yaml patches .npmrc \
            jest.config.js jest.setup.js babel.config.js tsconfig.json \
            .github/workflows/ci.yml .github/actions/setup-pnpm)
          if [ -z "$CHANGED" ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "## Test — Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ このPRはテストに影響するファイルを変更していないため \`pnpm test\` をスキップしました。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-pnpm
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
      - run: pnpm test
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'

  doctor:
    name: Expo Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: npx expo install --check
      # expo-doctor は devDependencies に固定したものを使う。
      # `npx -y expo-doctor` だと毎 run で registry の latest を未レビューのまま
      # 実行することになり、lockfile によるサプライチェーン保護が効かない。
      - run: pnpm exec expo-doctor

  # Metro バンドルが通ることを CI で保証する。
  # 起動直後にクラッシュする原因の多くは、未解決 import や循環参照など
  # バンドル時に検出できる問題。`expo export` を回すと本番と同じ Metro パイプラインを
  # 経由するため、ローカル `expo run` だけでは見落としがちな構成エラーを捕まえられる。
  bundle:
    name: Bundle Export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 変更検出に origin/${{ base_ref }} との diff が要るため常に全履歴を取得する。
      # (depth を条件分岐しない理由は test ジョブの同名 step のコメントを参照)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PR でバンドルに影響しうるファイルが変更されていなければスキップする。
      # スキップの安全性については test ジョブの同名 step のコメントを参照。
      - name: Detect bundle-relevant changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- \
            app src assets package.json pnpm-lock.yaml patches .npmrc \
            app.config.ts babel.config.js tsconfig.json \
            .github/workflows/ci.yml .github/actions/setup-pnpm)
          if [ -z "$CHANGED" ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "## Bundle Export — Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ このPRはバンドルに影響するファイルを変更していないため \`expo export\` をスキップしました。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-pnpm
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
      - run: pnpm bundle:check
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
